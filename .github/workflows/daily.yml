name: daily

on:
  schedule:
    - cron: "17 19 * * *"   # 03:17 CST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Update sources and signals
        run: python -m shovel update --timeout 30

      - name: Verify official pages
        run: python -m shovel verify --timeout 15 --workers 6

      - name: Render artifacts
        run: python -m shovel report

      - name: Commit daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config data README.md resources.csv site
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: daily update $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
